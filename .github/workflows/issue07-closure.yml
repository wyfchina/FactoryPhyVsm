name: Accept and close I1 Issue 07

on:
  push:
    branches: [codex/vsm-v04-github-ready]
    paths:
      - .github/workflows/issue07-closure.yml
      - scripts/github/close-issue07.cjs
      - outputs/vsm-michigan-steel-baseline/evidence/issue07-closure-request.json

permissions:
  contents: read
  issues: write

concurrency:
  group: factoryphyvsm-issue07-closure
  cancel-in-progress: false

jobs:
  close-issue07:
    if: github.repository == 'wyfchina/FactoryPhyVsm' && github.actor == 'wyfchina'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./scripts/github/close-issue07.cjs');
            await run({ github, context, core });
